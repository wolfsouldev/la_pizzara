$kind: http-request
name: Crear evento privado
order: 6000
url: "{{baseUrl}}/admin/calendar/events"
method: POST
headers:
  - key: Origin
    value: "{{appOrigin}}"
  - key: X-CSRF-Token
    value: "{{csrfToken}}"
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"title":"{{calendarTitle}}","startAt":{{calendarStart}},"endAt":{{calendarEnd}},"visibility":"PRIVATE"}
