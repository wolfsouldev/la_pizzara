$kind: http-request
name: Crear solicitud propia
order: 2000
url: "{{baseUrl}}/calendar/requests"
method: POST
headers:
  - key: Origin
    value: "{{appOrigin}}"
  - key: X-CSRF-Token
    value: "{{csrfToken}}"
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"title":"{{calendarTitle}}","purpose":"{{calendarPurpose}}","startAt":{{calendarStart}},"endAt":{{calendarEnd}},"attendees":{{calendarAttendees}}}
