$kind: http-request
name: Rechazar solicitud
order: 11000
url: "{{baseUrl}}/admin/calendar/requests/{{calendarRequestId}}/reject"
method: POST
headers:
  - key: Origin
    value: "{{appOrigin}}"
  - key: X-CSRF-Token
    value: "{{csrfToken}}"
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"note":"{{calendarDecisionNote}}"}
