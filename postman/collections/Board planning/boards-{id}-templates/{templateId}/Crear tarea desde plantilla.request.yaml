$kind: http-request
description: EDIT, plantilla del mismo tablero. Columna obligatoria; omitir campos
  usa valores de plantilla. dueInDays suma periodos de 24 horas al momento de creación;
  dueAt explícito incluido null prevalece. Checklist nuevo sin completar, todo transaccional.
url: '{{baseUrl}}/boards/{{boardId}}/templates/{{templateId}}/tasks'
method: POST
headers:
- key: Accept
  value: application/json
- key: Content-Type
  value: application/json
- key: Origin
  value: '{{origin}}'
- key: X-CSRF-Token
  value: '{{csrfToken}}'
body:
  type: json
  content: '{{taskFromTemplate}}'
auth:
  type: noauth
order: 3000
scripts:
- type: afterResponse
  language: text/javascript
  code: 'pm.test(''HTTP 201'', () => pm.response.to.have.status(201));

    pm.test(''Respuesta con datos reales'', () => { const body=pm.response.json();
    pm.expect(body).to.have.property(''data''); pm.expect(body).not.to.have.property(''error'');
    });'
