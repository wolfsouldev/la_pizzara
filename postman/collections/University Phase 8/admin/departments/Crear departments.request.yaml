$kind: http-request
url: '{{baseUrl}}/admin/departments'
method: POST
headers:
- key: Origin
  value: '{{origin}}'
  disabled: false
  description: '(Required) '
- key: X-CSRF-Token
  value: '{{csrfToken}}'
  disabled: false
  description: '(Required) '
- key: Content-Type
  value: application/json
- key: Accept
  value: application/json
body:
  type: json
  content: "{\n  \"name\": \"{{name}}\",\n  \"slug\": \"{{slug}}\",\n  \"description\"\
    : \"{{description}}\",\n  \"isActive\": {{isActive}}\n}"
auth:
  type: noauth
order: 2000
