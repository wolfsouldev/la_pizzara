$kind: http-request
url: '{{baseUrl}}/admin/users/:id/status'
method: PATCH
headers:
- key: Origin
  value: '{{origin}}'
  disabled: false
  description: '(Required) '
- key: X-CSRF-Token
  value: '{{csrfToken}}'
  disabled: false
  description: '(Required) '
- key: Content-Type
  value: application/json
- key: Accept
  value: application/json
pathVariables:
- key: id
  value: '{{id}}'
body:
  type: json
  content: "{\n  \"isActive\": {{isActive}}\n}"
auth:
  type: noauth
order: 3000
