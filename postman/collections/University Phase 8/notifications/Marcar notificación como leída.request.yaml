$kind: http-request
description: Sesión y destinatario exclusivos. Lectura y conteos filtrados por permisos
  actuales del recurso. Notificaciones internas jamás visibles para USER. Escrituras
  con origen y CSRF. Id ajeno/inaccesible devuelve 404.
url: '{{baseUrl}}/notifications/:id/read'
method: PATCH
headers:
  Accept: application/json
  Origin: '{{origin}}'
  X-CSRF-Token: '{{csrfToken}}'
pathVariables:
- key: id
  value: '{{id}}'
  disabled: false
  description: '(Required) '
auth:
  type: noauth
settings: {}
order: 3000
