$kind: http-request
description: 'Interno: USER siempre denegado. ADMIN global o TECHNICIAN activo con
  pertenencia al departamento y al tablero. VIEW lee; EDIT modifica tareas; MANAGE
  configura miembros/columnas. Tableros/tareas archivados son de solo lectura. Crear
  tablero exclusivo ADMIN. Origen y CSRF obligatorios al escribir.'
url: '{{baseUrl}}/tasks/:id/move'
method: POST
headers:
- key: Origin
  value: string
  disabled: false
  description: '(Required) '
- key: X-CSRF-Token
  value: string
  disabled: false
  description: '(Required) '
- key: Content-Type
  value: application/json
- key: Accept
  value: application/json
pathVariables:
- key: id
  value: '{{id}}'
  disabled: false
  description: '(Required) '
body:
  type: json
  content: "{\n  \"targetColumnId\": \"{{targetColumnId}}\",\n  \"targetIndex\": 0\n\
    }"
auth:
  type: noauth
settings: {}
order: 3000
