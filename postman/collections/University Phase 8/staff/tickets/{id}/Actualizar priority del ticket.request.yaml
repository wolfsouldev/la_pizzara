$kind: http-request
description: 'ADMIN: acceso global. TECHNICIAN: solo departamentos propios; mutaciones
  solo si es responsable. Asignación y cambio de departamento exclusivos de ADMIN.
  CLOSED es de solo lectura. Las escrituras exigen Origin y CSRF.'
url: '{{baseUrl}}/staff/tickets/:id/priority'
method: PATCH
headers:
  Origin: '{{origin}}'
  X-CSRF-Token: '{{csrfToken}}'
  Content-Type: application/json
  Accept: application/json
pathVariables:
- key: id
  value: '{{id}}'
  disabled: false
  description: '(Required) '
body:
  type: json
  content: "{\n  \"priority\": \"{{priority}}\"\n}"
auth:
  type: noauth
settings: {}
order: 3000
