$kind: http-request
description: ADMIN o TECHNICIAN con alcance de departamento. DTO sin notas internas.
url: '{{baseUrl}}/staff/tickets/:ticketId/service'
method: GET
headers:
- key: Accept
  value: application/json
pathVariables:
- key: ticketId
  value: '{{ticketId}}'
auth:
  type: noauth
settings: {}
order: 1000
scripts:
- type: afterResponse
  language: text/javascript
  code: 'pm.test("HTTP 200", () => pm.response.to.have.status(200));

    pm.test("Respuesta con data", () => pm.expect(pm.response.json()).to.have.property("data"));'
