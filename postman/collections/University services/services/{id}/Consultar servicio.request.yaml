$kind: http-request
description: Autenticado. Solo activos; sin notas internas.
url: '{{baseUrl}}/services/:id'
method: GET
headers:
- key: Accept
  value: application/json
pathVariables:
- key: id
  value: '{{id}}'
  disabled: false
  description: '(Required) '
auth:
  type: noauth
settings: {}
order: 1000
scripts:
- type: afterResponse
  language: text/javascript
  code: 'pm.test("HTTP 200", () => pm.response.to.have.status(200));

    pm.test("Respuesta con data", () => pm.expect(pm.response.json()).to.have.property("data"));

    pm.test("URL HTTP/HTTPS o null", () => { const url = pm.response.json().data.url;
    pm.expect(url === null || /^https?:\/\//i.test(url)).to.eql(true); });'
