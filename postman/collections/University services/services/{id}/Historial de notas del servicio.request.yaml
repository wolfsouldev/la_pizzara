$kind: http-request
description: Autenticado. Solo notas PUBLIC de servicio activo, sin autores ni metadatos
  internos.
url: '{{baseUrl}}/services/:id/notes?page=1&limit=20'
method: GET
headers:
- key: Accept
  value: application/json
queryParams:
- key: page
  value: '1'
- key: limit
  value: '20'
pathVariables:
- key: id
  value: '{{id}}'
  disabled: false
  description: '(Required) '
auth:
  type: noauth
settings: {}
order: 2000
scripts:
- type: afterResponse
  language: text/javascript
  code: 'pm.test("HTTP 200", () => pm.response.to.have.status(200));

    pm.test("Respuesta con data", () => pm.expect(pm.response.json()).to.have.property("data"));

    pm.test("Solo notas publicas", () => pm.response.json().data.forEach(n => pm.expect(n.visibility).to.eql("PUBLIC")));'
